<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math Practice — Выбор класса</title>
<style>
:root{font-family:Inter,"Segoe UI",Arial,sans-serif;color:#17364b;background:#e9f6fa}
*{box-sizing:border-box}body{margin:0;min-height:100vh}
header{background:white;padding:22px max(20px,4vw);border-bottom:1px solid #d5e8ef}
h1{font-size:clamp(24px,3vw,34px);margin:0}main{max-width:940px;margin:8vh auto;padding:0 22px}
h2{font-size:clamp(23px,3vw,32px);margin-bottom:10px}p{color:#557487;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;margin-top:30px}
a.card{display:block;text-decoration:none;background:white;border:1px solid #d5e8ef;border-radius:18px;padding:32px;box-shadow:0 4px 20px #17445a12;color:#17364b;transition:transform .15s,box-shadow .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);box-shadow:0 8px 28px #17445a22;outline:2px solid #119ec1}
.icon{font-size:38px}.name{font-size:27px;font-weight:750;margin:15px 0 10px}.desc{color:#557487}.go{display:inline-block;margin-top:23px;background:#119ec1;color:white;padding:12px 19px;border-radius:10px;font-weight:700}
@media(max-width:650px){.grid{grid-template-columns:1fr}main{margin:35px auto}a.card{padding:25px}}
</style>
</head>
<body>
<header><h1>📘 Math Practice</h1></header>
<main>
<h2>Выберите свой класс</h2>
<p>Откройте сайт с заданиями для вашего класса.</p>
<div class="grid">
<a class="card" href="./grade10/"><div class="icon">📘</div><div class="name">Math Practice — 10 классы</div><div class="desc">10В · 10Г · 10Д</div><span class="go">Перейти к заданиям</span></a>
<a class="card" href="./grade11/"><div class="icon">🎓</div><div class="name">Math Practice — 11 классы</div><div class="desc">11В · 11Г · 11Д</div><span class="go">Перейти к заданиям</span></a>
</div>
</main>
</body>
</html>
